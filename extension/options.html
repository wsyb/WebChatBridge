<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Chat Bridge — 设置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: rgba(255, 255, 255, 0.9);
      min-height: 100vh;
    }
    .header {
      padding: 24px 32px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .header h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .header p { font-size: 13px; color: rgba(255, 255, 255, 0.5); }
    .container { max-width: 900px; margin: 0 auto; padding: 24px 32px; }

    /* Section */
    .section { margin-bottom: 32px; }
    .section-title {
      font-size: 14px; font-weight: 600; color: rgba(255, 255, 255, 0.7);
      margin-bottom: 16px; padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* Form */
    .form-row { margin-bottom: 16px; }
    .form-row label {
      display: block; font-size: 13px; color: rgba(255, 255, 255, 0.6); margin-bottom: 6px;
    }
    .form-row input[type="text"],
    .form-row input[type="number"] {
      width: 100%; max-width: 300px; padding: 8px 12px; border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(0, 0, 0, 0.3);
      color: rgba(255, 255, 255, 0.9); font-size: 14px; outline: none;
      transition: border-color 0.15s;
    }
    .form-row input:focus { border-color: rgba(99, 102, 241, 0.5); }
    .form-hint { font-size: 12px; color: rgba(255, 255, 255, 0.35); margin-top: 6px; }

    /* Platform tabs */
    .platform-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .platform-tab {
      padding: 8px 16px; border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px; cursor: pointer; transition: all 0.15s;
    }
    .platform-tab:hover { background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.9); }
    .platform-tab.active { background: rgba(99, 102, 241, 0.2); border-color: rgba(99, 102, 241, 0.4); color: #a5b4fc; }

    /* Prompt editor */
    .editor-label { font-size: 13px; color: rgba(255, 255, 255, 0.6); margin-bottom: 8px; }
    .editor-label .adapter-name { color: #a5b4fc; font-weight: 500; }
    .prompt-textarea {
      width: 100%; min-height: 480px; padding: 16px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 0, 0, 0.3);
      color: rgba(255, 255, 255, 0.9);
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 13px; line-height: 1.6; resize: vertical; outline: none;
      transition: border-color 0.15s;
    }
    .prompt-textarea:focus { border-color: rgba(99, 102, 241, 0.5); }
    .prompt-textarea::placeholder { color: rgba(255, 255, 255, 0.25); }

    /* Actions */
    .actions { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
    .btn {
      padding: 8px 20px; border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 13px; cursor: pointer; transition: all 0.15s;
    }
    .btn-primary { background: rgba(99, 102, 241, 0.2); border-color: rgba(99, 102, 241, 0.4); color: #a5b4fc; }
    .btn-primary:hover { background: rgba(99, 102, 241, 0.3); }
    .btn-secondary { background: rgba(255, 255, 255, 0.04); color: rgba(255, 255, 255, 0.6); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.8); }
    .status-msg { font-size: 12px; opacity: 0; transition: opacity 0.3s; }
    .status-msg.show { opacity: 1; }
    .status-msg.success { color: #34d399; }
    .status-msg.error { color: #f87171; }

    @media (prefers-color-scheme: light) {
      body { background: #f5f5f7; color: rgba(0, 0, 0, 0.85); }
      .header { border-bottom-color: rgba(0, 0, 0, 0.08); }
      .header p { color: rgba(0, 0, 0, 0.4); }
      .section-title { color: rgba(0, 0, 0, 0.6); border-bottom-color: rgba(0, 0, 0, 0.06); }
      .form-row input { border-color: rgba(0, 0, 0, 0.12); background: rgba(255, 255, 255, 0.8); color: rgba(0, 0, 0, 0.85); }
      .form-hint { color: rgba(0, 0, 0, 0.35); }
      .platform-tab { border-color: rgba(0, 0, 0, 0.12); background: rgba(0, 0, 0, 0.03); color: rgba(0, 0, 0, 0.6); }
      .platform-tab.active { background: rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.3); color: #6366f1; }
      .prompt-textarea { border-color: rgba(0, 0, 0, 0.12); background: rgba(255, 255, 255, 0.8); color: rgba(0, 0, 0, 0.85); }
      .btn-primary { background: rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.3); color: #6366f1; }
      .btn-secondary { background: rgba(0, 0, 0, 0.04); color: rgba(0, 0, 0, 0.5); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚙️ Web Chat Bridge 设置</h1>
    <p>配置连接地址和 AI 平台提示词</p>
  </div>
  <div class="container">
    <!-- 连接设置 -->
    <div class="section">
      <div class="section-title">连接设置</div>
      <div class="form-row">
        <label>Native Host 地址</label>
        <input type="text" id="native-host" value="127.0.0.1" placeholder="127.0.0.1">
      </div>
      <div class="form-row">
        <label>端口</label>
        <input type="number" id="native-port" value="18789" placeholder="18789" min="1" max="65535">
        <div class="form-hint">本地使用默认即可，远程需配置 IP 和端口</div>
      </div>
    </div>

    <!-- 提示词设置 -->
    <div class="section">
      <div class="section-title">提示词设置</div>
      <div class="platform-tabs" id="platform-tabs"></div>
      <div class="editor-label">提示词 — <span class="adapter-name" id="current-adapter-label">DeepSeek</span></div>
      <textarea class="prompt-textarea" id="prompt-editor" placeholder="输入该平台的系统提示词..." spellcheck="false"></textarea>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="save-btn">💾 保存</button>
      <button class="btn btn-secondary" id="reset-btn">🔄 重置为默认</button>
      <span class="status-msg" id="status-msg"></span>
    </div>
  </div>
  <script type="module" src="dist/options/index.js"></script>
</body>
</html>
