<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Chat Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      background: rgba(20, 20, 40, 0.95);
      color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: rgba(255, 255, 255, 0.9);
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .row label {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
    }
    .status {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 10px;
    }
    .status.connected {
      background: rgba(34, 197, 94, 0.15);
      color: #34d399;
    }
    .status.disconnected {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }
    /* Start command */
    .start-cmd {
      display: none;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .start-cmd.visible { display: block; }
    .start-cmd-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 6px;
    }
    .start-cmd-hint {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 6px;
    }
    .start-cmd-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .start-cmd-code {
      flex: 1;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      color: #60a5fa;
      background: rgba(0, 0, 0, 0.2);
      padding: 6px 10px;
      border-radius: 4px;
      user-select: all;
    }
    .copy-btn {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid rgba(96, 165, 250, 0.3);
      background: rgba(96, 165, 250, 0.1);
      color: #60a5fa;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .copy-btn:hover {
      background: rgba(96, 165, 250, 0.2);
      border-color: rgba(96, 165, 250, 0.5);
    }
    .copy-btn.copied {
      background: rgba(34, 197, 94, 0.15);
      border-color: rgba(34, 197, 94, 0.3);
      color: #34d399;
    }
    /* Toggle switch */
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      cursor: pointer;
    }
    .toggle input { display: none; }
    .toggle .slider {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 11px;
      transition: background 0.2s;
    }
    .toggle .slider::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .slider {
      background: rgba(99, 102, 241, 0.6);
    }
    .toggle input:checked + .slider::after {
      transform: translateX(18px);
    }
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 16px 0;
    }
    .settings-btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .settings-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.9);
    }
    .footer-link {
      display: block;
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
    }
    .footer-link:hover { color: rgba(255, 255, 255, 0.6); }
    @media (prefers-color-scheme: light) {
      body { background: rgba(255, 255, 255, 0.95); color: rgba(0, 0, 0, 0.85); }
      h1 { color: rgba(0, 0, 0, 0.85); }
      .toggle .slider { background: rgba(0, 0, 0, 0.15); }
      .toggle .slider::after { background: #fff; }
      .settings-btn { border-color: rgba(0, 0, 0, 0.1); background: rgba(0, 0, 0, 0.03); color: rgba(0, 0, 0, 0.6); }
      .settings-btn:hover { background: rgba(0, 0, 0, 0.06); color: rgba(0, 0, 0, 0.8); }
      .start-cmd { background: rgba(0, 0, 0, 0.04); border-color: rgba(0, 0, 0, 0.1); }
      .start-cmd-hint { color: rgba(0, 0, 0, 0.4); }
      .start-cmd-code { background: rgba(0, 0, 0, 0.06); color: #2563eb; }
      .copy-btn { border-color: rgba(37, 99, 235, 0.3); background: rgba(37, 99, 235, 0.06); color: #2563eb; }
      .copy-btn:hover { background: rgba(37, 99, 235, 0.12); }
      .footer-link { color: rgba(0, 0, 0, 0.35); }
      .footer-link:hover { color: rgba(0, 0, 0, 0.5); }
    }
  </style>
</head>
<body>
  <h1>Web Chat Bridge</h1>

  <div class="row">
    <label>连接状态</label>
    <span class="status disconnected" id="connection-status">未连接</span>
  </div>

  <div class="start-cmd" id="start-cmd">
    <div class="start-cmd-label">服务未运行，请按以下步骤操作：</div>
    <div class="start-cmd-row">
      <span class="start-cmd-code" id="start-cmd-code">wcb</span>
      <button class="copy-btn" id="copy-cmd-btn">复制</button>
    </div>
    <div class="start-cmd-hint">复制后打开终端执行，然后刷新页面</div>
  </div>

  <div class="row">
    <label>显示工具栏</label>
    <label class="toggle">
      <input type="checkbox" id="toggle-toolbar" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="divider"></div>

  <button class="settings-btn" id="open-settings">⚙️ 提示词设置</button>

  <a class="footer-link" href="https://wsyb.github.io/WebChatBridge/" target="_blank">📄 文档</a>

  <script type="module" src="dist/popup/index.js"></script>
</body>
</html>
